name: Paginas de perfumes

on:
  workflow_run:
    workflows: ["Actualizar catálogo"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paginas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generar paginas y sitemap
        run: python generar_paginas.py
      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A perfume sitemap.xml
          git diff --quiet --cached || git commit -m "Actualizar paginas de perfumes"
          git pull --rebase origin main || true
          git push
